<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOTHING® — DHA Phase 6, Karachi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0B0A;
    --panel: #141311;
    --fg: #F3F1EC;
    --muted: #97907F;
    --accent: #C4491F;
    --accent-soft: #E7C9AE;
    --line: #2A2823;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior:smooth;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:'Work Sans', ui-sans-serif, system-ui, sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  .reveal.in{ opacity:1; transform:translateY(0); }

  header{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
    background:rgba(11,11,10,0.9); backdrop-filter: blur(8px);
    border-bottom:1px solid var(--line);
  }
  nav{ max-width:960px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
  .brand{ font-family:'Archivo Black'; font-size:18px; letter-spacing:0.02em; display:flex; align-items:center; gap:6px;}
  .brand sup{font-size:10px; color:var(--muted); font-weight:400;}
  .navlinks{display:flex; gap:24px; font-size:14px; color:var(--muted);}
  .navlinks a{color:var(--muted); text-decoration:none; position:relative;}
  .navlinks a::after{content:""; position:absolute; left:0; bottom:-4px; width:0; height:1px; background:var(--fg); transition:width .25s ease;}
  .navlinks a:hover::after, .navlinks a:focus-visible::after{width:100%;}
  .navlinks a:hover, .navlinks a:focus-visible{color:var(--fg);}
  .btn-wa{
    display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff;
    text-decoration:none; padding:10px 16px; border-radius:2px; font-size:14px; font-weight:600;
    white-space:nowrap; transition: transform .2s ease, filter .2s ease;
  }
  .btn-wa:hover{filter:brightness(1.12); transform:translateY(-1px);}

  /* HERO */
  .hero{
    min-height: 90vh; display:flex; flex-direction:column; justify-content:center;
    padding: 110px 24px 70px; position:relative; overflow:hidden; border-bottom:1px solid var(--line);
  }
  .dotfield{ position:absolute; inset:0; z-index:0;
    background-image: radial-gradient(var(--line) 1.4px, transparent 1.4px);
    background-size: 24px 24px; animation: dotpulse 6s ease-in-out infinite;
  }
  @keyframes dotpulse{ 0%,100%{opacity:.6;} 50%{opacity:1;} }
  @media (prefers-reduced-motion: reduce){ .dotfield{animation:none;} .reveal{transition:none; opacity:1; transform:none;} }
  .hero-inner{max-width:960px; margin:0 auto; width:100%; position:relative; z-index:1;}
  .kicker{color:var(--muted); font-size:14px; margin-bottom:18px; display:flex; align-items:center; gap:10px;}
  .kicker .dot{width:6px; height:6px; border-radius:50%; background:var(--accent); display:inline-block;}
        <div><p class="menu-item-name">Taiba Mountain Water — 600ml</p></div>
        <div class="menu-item-price">Rs 100</div>
      </div>
      <div class="menu-item">
        <div><p class="menu-item-name">Cold Drink</p></div>
        <div class="menu-item-price">Rs 150</div>
      </div>
    </div>
  </div>
</section>

<section>
  <div class="wrap reveal">
    <div class="section-head"><h2 class="section-title">What people say</h2></div>
    <div class="rating-block">
      <div class="rating-num">4.8</div>
      <div>
        <div class="stars">★★★★★</div>
        <div class="rating-detail">164 public reviews on Google — the kind of number most restaurants pay ad money for. This page just puts it where a first-time visitor sees it before they walk in.</div>
      </div>
    </div>
  </div>
</section>

<section id="location">
  <div class="wrap reveal">
    <div class="section-head"><h2 class="section-title">Find us</h2></div>
    <div class="loc-grid">
      <div>
        <div class="loc-card"><h3>Address</h3><p>B-2C, 10th Commercial Street, Nishat Commercial, DHA Phase 6, Karachi</p></div>
        <div class="loc-card"><h3>WhatsApp / Call</h3><p>0300-3844495</p></div>
      </div>
      <div class="pin-graphic">
        <div class="pin"></div>
        <p>Off Khayaban-e-Bukhari, between 11th &amp; 12th Street — a live Google Maps embed slots in here on the final build.</p>
        <a class="btn-outline" href="https://www.google.com/maps/search/?api=1&query=NOTHING+Restaurant+DHA+Phase+6+Karachi" target="_blank" rel="noopener">Open in Maps</a>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="brand">NOTHING<sup>®</sup></div>
  <p>B-2C, 10th Commercial Street, Nishat Commercial, DHA Phase 6, Karachi</p>
  <p><a href="https://wa.me/923003844495?text=Hi%2C%20I%27d%20like%20to%20order" target="_blank" rel="noopener">+92 300 3844495</a></p>
  <div class="demo-flag">Free demo — send your own food photography and this becomes your live site.</div>
</footer>

<script>
  var els = document.querySelectorAll('.reveal');
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, {threshold:0.15});
    els.forEach(function(el){ io.observe(el); });
  } else {
    els.forEach(function(el){ el.classList.add('in'); });
  }
</script>

</body>
</html>
